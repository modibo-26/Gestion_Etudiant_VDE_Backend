spring.application.name=etudiants
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=gestion_etudiants;encrypt=true;trustServerCertificate=true
#spring.datasource.username=SA
#spring.datasource.password=Password123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#spring.devtools.restart.enabled=false
eureka.client.enabled=false

#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
server.port=8083
logging.level.org.springframework.security=DEBUG
#SAMIRA CONNECTION DETAILS
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=gestion_etudiants;encrypt=true;trustServerCertificate=true

spring.datasource.username=sa
spring.datasource.password=1234

# Swagger / Springdoc configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha